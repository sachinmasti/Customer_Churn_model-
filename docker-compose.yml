services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: churn-api
    ports:
      - "8000:8000"
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: churn-ui
    ports:
      - "7860:7860"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped
